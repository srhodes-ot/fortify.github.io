<!DOCTYPE html>
<html dir="ltr" lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <meta name="keywords" content="{{ site.keywords }}">
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/dist/css/styles.css">
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/dist/fonts/qtm-fonts.css">
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/dist/icons/qtm-icons.css">
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/dist/icons/qtm-font-icons.css">
    <link rel="icon" href="{{ site.baseurl }}/dist/img/cropped-fOR-WEBSITE-32x32.png" sizes="32x32">
</head>

<body>
    <nav class="navbar navbar-fixed-top">
        <a href="/" class="navbar-brand">
            <img class="mffod-logo" src="{{ site.baseurl }}/dist/img/fortify-icon.svg" alt="Microfocus Logo" width="50" />
        </a>
        <div class="navbar-nav">
            <a class="nav-link item {% if page.url == '/' %} active {% endif %}" href="{{ site.baseurl }}/">Home</a>
            {% for node in site.pages reversed %} {% capture id %}{{ node.id | remove:'/' | downcase }}{% endcapture %}
            {% if node.layout == 'page' %}
            <a class="nav-link item {% if page.url == node.url %} active {% endif %}" href="{{ site.baseurl }}{{node.url}}">{{node.title}}</a>
                {% endif %}
            {% endfor %}
        </div>
    </nav>

    <!-- Page Contents -->
    <div class="content-container">
        {{content}}
    </div>
    <footer class="footer">
        {% include footer.html %}
    </footer>
</body>
<script src="{{ site.baseurl }}/dist/js/jquery.min.js"></script>
<script>
    $(document).ready(function() {
        const $win = $(window);
        const titlebar = document.querySelector('.title-bar');
        const navHeight = document.querySelector('.navbar').offsetHeight * 1.618;
        const scrollerClass = 'scroller';

        function updateScroller() {
            var scroll = $win.scrollTop();
            if (scroll > navHeight) {
                titlebar.classList.add(scrollerClass);
            } else {
                titlebar.classList.remove(scrollerClass);
            }
        }

        // initial check on page load
        updateScroller();

        $win.on('scroll', updateScroller);
    });
</script>

</html>
